  <!-- Loading-screen styles are inline so it paints before anything else arrives. -->
  <style>
    html:not(.is-ready){overflow:hidden}
    #loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#FDF9F4;transition:opacity .7s ease,visibility .7s ease}
    #loader.is-done{opacity:0;visibility:hidden}
    #loader::before{content:"";position:absolute;width:min(620px,95vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(96,36,96,.11),rgba(96,36,96,0));animation:loader-glow 2.6s ease-in-out infinite}
    .loader__inner{position:relative;display:grid;justify-items:center;gap:30px}
    .loader__badge{display:block;animation:loader-breathe 2.2s ease-in-out infinite}
    .loader__badge img{display:block;width:min(270px,62vw);height:auto;aspect-ratio:975/320}
    .loader__bar{width:150px;height:3px;border-radius:99px;background:#F1E4F2;overflow:hidden}
    .loader__bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#602460,#9A4F89);transform-origin:left;transform:scaleX(0);animation:loader-fill 1.8s cubic-bezier(.25,.7,.2,1) forwards}
    #loader.is-finishing .loader__bar i{animation:none;transform:scaleX(1);transition:transform .25s ease-out}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    @keyframes loader-breathe{0%,100%{opacity:.7;transform:scale(.985)}50%{opacity:1;transform:scale(1)}}
    @keyframes loader-glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
    @keyframes loader-fill{to{transform:scaleX(.92)}}
    @media (prefers-reduced-motion:reduce){#loader::before,.loader__badge,.loader__bar i{animation:none}.loader__bar i{transform:scaleX(1)}#loader{transition-duration:.01ms}}
  </style>
  <script>document.documentElement.className+=" js"</script>
  <noscript><style>#loader{display:none}html:not(.is-ready){overflow:auto}.reveal{opacity:1!important;transform:none!important;animation:none!important}.progress__fill{width:30%!important}.progress__value{display:none}</style></noscript>

  <link rel="stylesheet" href="/assets/style.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Chikit",
    "url": "https://chikit.in/",
    "logo": "https://chikit.in/assets/brand/chikit-logo.webp",
    "slogan": "Ayurveda and Wellness",
    "description": "Rooted in Ayurveda. Thoughtfully crafted for a healthier, happier you."
  }
  </script>

<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="loader__inner">
      <div class="loader__badge"><img src="/assets/brand/chikit-logo-480.webp" width="975" height="320" alt="Chikit — Ayurveda and Wellness" /></div>
      <span class="loader__bar" aria-hidden="true"><i></i></span>
      <span class="sr-only">Loading</span>
    </div>
  </div>

  <div class="bg" aria-hidden="true">
    <img
      src="/assets/images/chikit-hero-1600.webp"
      srcset="/assets/images/chikit-hero-900.webp 900w, /assets/images/chikit-hero-1600.webp 1600w, /assets/images/chikit-hero-2200.webp 2200w"
      sizes="100vw" width="2200" height="1240" alt="" fetchpriority="high" decoding="async"
    />
    <div class="bg__overlay"></div>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main id="main" class="stage">
    <a class="brand reveal" style="--d:0" href="/" aria-label="Chikit home">
      <img src="/assets/brand/chikit-logo-480.webp" srcset="/assets/brand/chikit-logo-480.webp 480w, /assets/brand/chikit-logo.webp 975w" sizes="(max-width: 640px) 46vw, 368px" width="975" height="320" alt="Chikit — Ayurveda and Wellness" decoding="async" />
    </a>

    <section class="status" aria-labelledby="headline">
      <p class="eyebrow reveal" style="--d:1">Preparing for launch</p>
      <h1 class="headline reveal" id="headline" style="--d:2">Coming&nbsp;Soon</h1>

      <div class="progress reveal" style="--d:3" role="progressbar" id="progressBar" aria-label="Launch preparation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"><span class="progress__dot"></span></div>
        </div>
        <span class="progress__value" id="progressValue">0%</span>
      </div>

      <p class="tagline reveal" style="--d:4">
        The future of Ayurvedic wellness is almost here.<br />
        Stay tuned.
      </p>
    </section>
  </main>

  <script src="/assets/script.js" defer></script>
</body>
