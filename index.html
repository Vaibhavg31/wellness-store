<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chikit | Coming Soon</title>
  <meta name="description" content="Chikit — Ayurveda and Wellness. The future of Ayurvedic wellness is almost here." />
  <meta name="theme-color" content="#0c1f16" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chikit | Coming Soon" />
  <meta property="og:description" content="Ayurveda and Wellness. The future of Ayurvedic wellness is almost here. Stay tuned." />
  <meta property="og:image" content="/assets/images/chikit-hero.jpg" />
  <meta property="og:site_name" content="Chikit" />

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="preload" as="image" href="/assets/images/chikit-hero.jpg" fetchpriority="high" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img src="/assets/images/chikit-hero.jpg" alt="" fetchpriority="high" />
    <div class="bg__overlay"></div>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <header class="brandmark">
      <p class="domain reveal" style="--d:0">chikit.in</p>
      <div class="wordmark-row reveal" style="--d:1">
        <svg class="leaf-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" />
          <path d="M32 50V16" />
          <path d="M32 22c10-6 18-2 18 8-10 4-16 0-18-8z" />
          <path d="M32 32c-10-6-18-2-18 8 10 4 16 0 18-8z" />
        </svg>
        <h1 class="wordmark">Chikit</h1>
      </div>
      <p class="subtitle reveal" style="--d:2">Ayurveda &amp; Wellness</p>
    </header>

    <section class="status">
      <p class="eyebrow reveal" style="--d:3">Preparing for Launch</p>
      <h2 class="headline reveal" style="--d:4">Coming&nbsp;Soon</h2>

      <div class="progress reveal" style="--d:5">
        <div class="progress__track">
          <div class="progress__fill" id="progressFill">
            <span class="progress__dot"></span>
          </div>
          <div class="progress__glow" id="progressGlow"></div>
        </div>
        <span class="progress__value" id="progressValue">0%</span>
      </div>

      <p class="tagline reveal" style="--d:6">
        The future of Ayurvedic wellness is almost here.<br />
        Stay tuned.
      </p>

      <form class="notify reveal" id="notifyForm" style="--d:7" novalidate>
        <label for="notifyEmail" class="sr-only">Email address</label>
        <input
          type="email"
          id="notifyEmail"
          name="email"
          placeholder="Enter your email for launch updates"
          autocomplete="email"
          required
        />
        <button type="submit">Notify Me</button>
      </form>
      <p class="notify__message" id="notifyMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/assets/script.js" defer></script>
</body>
</html>
