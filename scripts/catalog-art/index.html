<!doctype html>
<!--
  Chikit dummy catalogue artwork: original, Chikit-branded product packshots, banners and social tiles that give the
  storefront a realistic "D2C wellness brand" look until real photography is shot. Rendered by build.mjs.
  Open via the local server that build.mjs starts: ?scene=<id>
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chikit catalogue art</title>
<style>
  @font-face { font-family: 'Lora'; font-weight: 600; src: url('/fonts/lora-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Lora'; font-weight: 500; src: url('/fonts/lora-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('/fonts/poppins-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('/fonts/poppins-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url('/fonts/poppins-600-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Poppins', sans-serif; color: #241720; }
  .scene { position: relative; overflow: hidden; }
  .abs { position: absolute; }

  /* packs */
  .pk { position: absolute; transform: translateX(-50%); }
  .pk > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lw { position: absolute; container-type: inline-size; overflow: hidden; }
  .lw::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(20,8,20,.30) 0%, rgba(20,8,20,.04) 13%, rgba(255,255,255,.34) 25%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 68%, rgba(20,8,20,.10) 85%, rgba(20,8,20,.34) 100%); }
  .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; padding: 7cqw 6cqw 0; color: #241720; }
  .label img { width: 56cqw; display: block; }
  .label .nm { display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; }
  .label .l1 { font-family: 'Lora', serif; font-weight: 600; font-size: 12.5cqw; line-height: 1.05; }
  .label .l2 { font-weight: 600; font-size: 7.4cqw; letter-spacing: .04em; text-transform: uppercase; color: var(--a); }
  .label .sb { font-size: 5.2cqw; color: #6B5D68; margin-top: 1cqw; }
  .label .ic { width: 17cqw; height: 17cqw; border-radius: 50%; display: grid; place-items: center; background: var(--t); color: var(--a); }
  .label .ic svg { width: 62%; height: 62%; }
  .label .bd { align-self: stretch; margin: 0 -6cqw; padding: 3.2cqw 4cqw; background: var(--a); color: #fff; font-size: 4.6cqw; font-weight: 500; letter-spacing: .05em; display: flex; justify-content: center; gap: 3cqw; text-transform: uppercase; }
  .label.plain { padding-top: 0; }

  .shadow { position: absolute; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(45,20,45,.42), rgba(45,20,45,.16) 55%, rgba(45,20,45,0)); filter: blur(3px); }
  .arch { position: absolute; border-radius: 999px 999px 0 0; }
  .blob { position: absolute; border-radius: 50%; }
  .txt { position: absolute; }
  .serif { font-family: 'Lora', serif; font-weight: 600; }
</style>
</head>
<body>
<script type="module" src="./scenes.js"></script>
</body>
</html>
